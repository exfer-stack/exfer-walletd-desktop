[package]
name        = "exfer-walletd-desktop"
version     = "0.14.1"
description = "Desktop GUI for exfer-walletd. One double-click → walletd in-process + a window for balance / generate-address / transfer."
edition     = "2021"
license     = "MIT"

[lib]
# The `_lib` suffix avoids a Windows-only conflict between the lib and
# bin names (see https://github.com/rust-lang/cargo/issues/8519).
name        = "exfer_walletd_desktop_lib"
crate-type  = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri              = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"

# Produce the official Exfer CLI "wallet.key" (EXFK) format for
# per-address export: Argon2id KDF + AES-256-GCM, byte-identical to the
# exfer crate's Wallet::save_encrypted so exfer.dev / the CLI import it.
argon2             = "0.5"
aes-gcm            = "0.10"
rand               = "0.8"
tokio              = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-util         = { version = "0.7", features = ["rt"] }

# The embedded walletd. Pinned to the released tag (now that walletd cuts
# proper releases) — the SAME version mobile ships, so the cross-chain swap
# engine + BSC/EVM key management behave byte-for-byte identically. v1.13.0
# carries: independent BSC/EVM key (own mnemonic, create/import/export), the
# vault carrying that key, networkFeeBnb in the quote projection, the HTLC
# reveal-gate funds-safety check, the delete_address LP-shares guard,
# expired-quote pruning, a per-swap execute/refund lock, and bsc_tx_history.
# Keep this tag in lockstep with mobile's pin.
exfer-walletd      = { git = "https://github.com/exfer-stack/exfer-walletd", tag = "v1.13.0" }

# HTTP client used by the Tauri Rust side to talk to the embedded
# walletd over loopback HTTPS. `rustls-tls-manual-roots` disables
# webpki-roots entirely so the fingerprint verifier is the only path
# the TLS handshake can take.
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
rustls             = "0.23"
# Public-internet TLS roots for outbound HTTPS to e.g. Binance (BNB/USD spot).
# The pinned walletd client uses manual roots; public_https_client() builds a
# separate webpki-rooted client so cert validation works for public hosts.
webpki-roots       = "0.26"
sha2               = "0.10"
hex                = "0.4"
# Standard-scheme mnemonic import preview: parse a 24-word BIP39 phrase and
# derive the standard / legacy candidate address before importing. Same pin as
# the mobile wallet so the derivation matches byte-for-byte.
bip39              = "2.2"

# Persist the keystore passphrase in the OS keychain (Keychain on
# macOS, Credential Manager on Windows, libsecret on Linux).
keyring            = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
anyhow             = "1"
thiserror          = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
