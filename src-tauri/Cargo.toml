[package]
name        = "exfer-walletd-desktop"
version     = "0.16.32"
description = "Desktop GUI for exfer-walletd. One double-click → walletd in-process + a window for balance / generate-address / transfer."
edition     = "2021"
license     = "MIT"

[lib]
# The `_lib` suffix avoids a Windows-only conflict between the lib and
# bin names (see https://github.com/rust-lang/cargo/issues/8519).
name        = "exfer_walletd_desktop_lib"
crate-type  = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri              = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"

# Produce the official Exfer CLI "wallet.key" (EXFK) format for
# per-address export: Argon2id KDF + AES-256-GCM, byte-identical to the
# exfer crate's Wallet::save_encrypted so exfer.dev / the CLI import it.
argon2             = "0.5"
aes-gcm            = "0.10"
rand               = "0.8"
tokio              = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time"] }
tokio-util         = { version = "0.7", features = ["rt"] }
# Official MCP client — drives the exfer-mcp sidecar over stdio AND user-added
# MCP servers over stdio or streamable-http (the reqwest variant reuses the same
# rustls stack the rest of the app already pulls in).
rmcp               = { version = "0.15", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }

# In-app CPU miner so the agent can self-fund by mining EXFER in-process (no
# downloaded binary, no subprocess) — the SAME handle the mobile wallet exposes,
# so the agent's exfer_mine_* tools behave identically on desktop. Pure Rust:
# exfer-pow is Argon2id only; exfer-stratum is rustls+ring (the same TLS stack
# reqwest already pulls in). GPU/CUDA is NOT enabled — CPU-only, "runs anywhere".
# Keep this rev in LOCKSTEP with mobile's pin.
exfer-pow          = { git = "https://github.com/exfer-stack/exfer-agent-miner", rev = "32db5e1" }
exfer-stratum      = { git = "https://github.com/exfer-stack/exfer-agent-miner", rev = "32db5e1" }

# The embedded walletd. Pinned to the released tag (now that walletd cuts
# proper releases) — the SAME version mobile ships, so the cross-chain swap
# engine + BSC/EVM key management behave byte-for-byte identically. v1.13.0
# carries: independent BSC/EVM key (own mnemonic, create/import/export), the
# vault carrying that key, networkFeeBnb in the quote projection, the HTLC
# reveal-gate funds-safety check, the delete_address LP-shares guard,
# expired-quote pruning, a per-swap execute/refund lock, and bsc_tx_history.
# Bumped 5ad5ca7 → 8b4d396 (hotfix/swap-recover, based on 5ad5ca7 so the ONLY
# change is the swap-recovery fix): settle-over-refund (a settled BUY no longer
# freezes at "Sending your funds") + new swap_refresh RPC (UI resolves a stale
# status on demand → no false "unmatched").
# Bumped 9b7a818 → b84af8a (v1.15.2): the v2 swap protocol (pool locks its side
# FIRST so the user locks once and walks away; a BNB→EXFER buy settles in a few
# minutes) plus swap-pool hardening — two new Config fields
# (inflight_reconcile / lock_watchdog) consumed below in walletd_supervisor.
# Keep this rev in LOCKSTEP with mobile's pin (mobile v1.0.25+ ships the same rev).
exfer-walletd      = { git = "https://github.com/exfer-stack/exfer-walletd", rev = "86b021111a8e53a50a94a0df8cbf740cb969333f" }

# HTTP client used by the Tauri Rust side to talk to the embedded
# walletd over loopback HTTPS. `rustls-tls-manual-roots` disables
# webpki-roots entirely so the fingerprint verifier is the only path
# the TLS handshake can take.
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
rustls             = "0.23"
# Public-internet TLS roots for outbound HTTPS to e.g. Binance (BNB/USD spot).
# The pinned walletd client uses manual roots; public_https_client() builds a
# separate webpki-rooted client so cert validation works for public hosts.
webpki-roots       = "0.26"
sha2               = "0.10"
hex                = "0.4"
# Standard-scheme mnemonic import preview: parse a 24-word BIP39 phrase and
# derive the standard / legacy candidate address before importing. Same pin as
# the mobile wallet so the derivation matches byte-for-byte.
bip39              = "2.2"

# Persist the keystore passphrase in the OS keychain (Keychain on
# macOS, Credential Manager on Windows, libsecret on Linux).
keyring            = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
anyhow             = "1"
thiserror          = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
