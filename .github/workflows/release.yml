name: Release

# Tag-triggered: `git tag v0.2.0 && git push --tags` cuts a Release
# with platform artifacts attached. The Release is created as a draft
# so the maintainer can curate the notes before publishing.

on:
  push:
    tags:
      - "v*"

# tauri-action creates a GitHub Release at the end of each platform
# build and uploads its artifact to it; that needs contents:write on
# the workflow's GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    name: Build & bundle (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            os: ubuntu-22.04
            args: ""
          - name: macos-aarch64
            os: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: windows-x86_64
            os: windows-latest
            args: ""
    # NOTE: macOS Intel (x86_64) is intentionally NOT in this matrix.
    # GitHub deprecated `macos-13` (the last x86_64 runner) and queue
    # times became hours-long, blocking the whole release. Apple Silicon
    # is dominant; Intel Mac users build from source per README.md.
    # When dtolnay/rust-toolchain + tauri-action stabilise the
    # `macos-latest --target x86_64-apple-darwin` cross-compile path,
    # we'll bring Intel back via that route.
    runs-on: ${{ matrix.platform.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform.args, 'aarch64-apple-darwin') && 'aarch64-apple-darwin' || (contains(matrix.platform.args, 'x86_64-apple-darwin') && 'x86_64-apple-darwin' || '') }}

      - name: Install Linux Tauri prereqs
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            build-essential

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing the updater artifacts (.sig) — without these the
          # build emits unsigned bundles and no latest.json, so in-app
          # update would have nothing to verify against.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "exfer-wallet ${{ github.ref_name }}"
          releaseBody: |
            Auto-built from ${{ github.ref_name }}.
            Includes the in-process exfer-walletd, no separate install needed.

            In-app auto-update is enabled from v0.4.0 onward: install this
            once, and future versions update themselves from within the app.
          releaseDraft: true
          prerelease: false
          # Emit + attach latest.json so the updater plugin can find it.
          # Windows prefers the NSIS installer as the update artifact.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.platform.args }}
