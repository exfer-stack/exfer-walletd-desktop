name: Release

# Tag-triggered: `git tag v0.2.0 && git push --tags` cuts a Release
# with platform artifacts attached. The Release is created as a draft
# so the maintainer can curate the notes before publishing.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build & bundle (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            os: ubuntu-22.04
            args: ""
          - name: macos-aarch64
            os: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macos-x86_64
            os: macos-13
            args: "--target x86_64-apple-darwin"
          - name: windows-x86_64
            os: windows-latest
            args: ""
    runs-on: ${{ matrix.platform.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform.args, 'aarch64-apple-darwin') && 'aarch64-apple-darwin' || (contains(matrix.platform.args, 'x86_64-apple-darwin') && 'x86_64-apple-darwin' || '') }}

      - name: Install Linux Tauri prereqs
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            build-essential

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "exfer-wallet ${{ github.ref_name }}"
          releaseBody: |
            Auto-built from ${{ github.ref_name }}.
            Includes the in-process exfer-walletd, no separate install needed.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.platform.args }}
